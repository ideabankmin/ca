<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>사진 계산기</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: white;
}

body {
    position: relative;
}

/* 가운데 ? */

#backgroundQuestion {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    font-size: min(55vw, 500px);
    font-weight: bold;

    color: black;

    z-index: 1;

    pointer-events: none;

    line-height: 1;
}

/* 사진 */

#photo {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 65vw;
    height: 65vw;

    max-width: 500px;
    max-height: 500px;

    object-fit: contain;

    z-index: 1;

    pointer-events: none;

    display: none;
}

/* 계산기 */

.calculator {
    position: relative;

    width: min(100%, 500px);

    height: 100vh;

    margin: auto;

    padding:
        max(20px, env(safe-area-inset-top))
        20px
        max(20px, env(safe-area-inset-bottom))
        20px;

    display: flex;
    flex-direction: column;

    justify-content: flex-end;

    z-index: 10;
}

/* 사진 설정 버튼 */

.setting {
    position: absolute;

    top: max(35px, calc(env(safe-area-inset-top) + 15px));
    left: 25px;

    width: 125px;
    height: 55px;

    border-radius: 30px;

    border: 1px solid #ddd;

    background: rgba(255,255,255,0.75);

    font-size: 18px;
    color: black;

    box-shadow: 0 3px 12px rgba(0,0,0,0.12);

    z-index: 50;

    cursor: pointer;

    touch-action: manipulation;
}

/* 버튼 영역 */

.buttons {
    width: 100%;

    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 12px;

    position: relative;

    z-index: 20;
}

/* 모든 계산기 버튼 */

.buttons button {
    width: 100%;
    aspect-ratio: 1 / 1;

    border-radius: 50%;

    border: 1px solid #ddd;

    background: rgba(255,255,255,0.62);

    color: black;

    font-size: clamp(28px, 9vw, 44px);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;

    box-shadow: 0 3px 12px rgba(0,0,0,0.10);

    cursor: pointer;

    touch-action: manipulation;

    position: relative;

    z-index: 30;
}

/* 버튼 눌렀을 때 */

.buttons button:active {
    transform: scale(0.94);
    background: rgba(220,220,220,0.75);
}

/* AC */

.ac {
    grid-column: span 2;

    border-radius: 50% !important;

    font-size: clamp(30px, 9vw, 44px) !important;
}

/* 0 */

.zero {
    grid-column: span 2;

    aspect-ratio: 2.05 / 1 !important;

    border-radius: 50px !important;
}

/* 연산 버튼 */

.operator {
    font-size: clamp(30px, 9vw, 44px) !important;
}

/* 설정창 */

#settings {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: min(90vw, 400px);

    max-height: 80vh;

    overflow-y: auto;

    background: white;

    border-radius: 25px;

    padding: 25px;

    box-shadow: 0 10px 40px rgba(0,0,0,0.25);

    z-index: 100;

    display: none;
}

#settings h2 {
    margin-top: 0;
    text-align: center;
}

.photoSetting {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin: 12px 0;

    font-size: 18px;
}

.photoSetting input {
    max-width: 190px;
}

.close {
    width: 100%;

    height: 50px;

    margin-top: 15px;

    border: none;

    border-radius: 25px;

    background: #eee;

    font-size: 18px;
}

/* 작은 화면 */

@media (max-height: 700px) {

    .buttons {
        gap: 8px;
    }

    .calculator {
        padding-left: 15px;
        padding-right: 15px;
    }

}

</style>
</head>

<body>

<!-- 가운데 ? -->

<div id="backgroundQuestion">?</div>

<!-- 사진 -->

<img id="photo">

<!-- 계산기 -->

<div class="calculator">

    <button class="setting" onclick="openSettings()">
        사진 설정
    </button>

    <div class="buttons">

        <button class="ac" onclick="clearAll()">AC</button>

        <button onclick="deleteNumber()">⌫</button>

        <button onclick="percent()">%</button>

        <button class="operator" onclick="operation('÷')">÷</button>

        <button onclick="number(7)">7</button>
        <button onclick="number(8)">8</button>
        <button onclick="number(9)">9</button>
        <button class="operator" onclick="operation('×')">×</button>

        <button onclick="number(4)">4</button>
        <button onclick="number(5)">5</button>
        <button onclick="number(6)">6</button>
        <button class="operator" onclick="operation('-')">−</button>

        <button onclick="number(1)">1</button>
        <button onclick="number(2)">2</button>
        <button onclick="number(3)">3</button>
        <button class="operator" onclick="operation('+')">+</button>

        <button onclick="plusMinus()">±</button>
        <button class="zero" onclick="number(0)">0</button>
        <button onclick="decimal()">.</button>

        <button class="operator" onclick="calculate()">=</button>

    </div>

</div>


<!-- 사진 설정창 -->

<div id="settings">

    <h2>사진 설정</h2>

    <div class="photoSetting">
        <span>1번 사진</span>
        <input type="file" accept="image/*" onchange="setPhoto(1,this)">
    </div>

    <div class="photoSetting">
        <span>2번 사진</span>
        <input type="file" accept="image/*" onchange="setPhoto(2,this)">
    </div>

    <div class="photoSetting">
        <span>3번 사진</span>
        <input type="file" accept="image/*" onchange="setPhoto(3,this)">
    </div>

    <div class="photoSetting">
        <span>4번 사진</span>
        <input type="file" accept="image/*" onchange="setPhoto(4,this)">
    </div>

    <div class="photoSetting">
        <span>5번 사진</span>
        <input type="file" accept="image/*" onchange="setPhoto(5,this)">
    </div>

    <div class="photoSetting">
        <span>6번 사진</span>
        <input type="file" accept="image/*" onchange="setPhoto(6,this)">
    </div>

    <div class="photoSetting">
        <span>7번 사진</span>
        <input type="file" accept="image/*" onchange="setPhoto(7,this)">
    </div>

    <div class="photoSetting">
        <span>8번 사진</span>
        <input type="file" accept="image/*" onchange="setPhoto(8,this)">
    </div>

    <div class="photoSetting">
        <span>9번 사진</span>
        <input type="file" accept="image/*" onchange="setPhoto(9,this)">
    </div>

    <button class="close" onclick="closeSettings()">
        닫기
    </button>

</div>


<script>

let current = "";
let previous = "";
let op = "";
let waiting = false;

let photos = {};


/* 저장된 사진 불러오기 */

for (let i = 1; i <= 9; i++) {

    let saved = localStorage.getItem("photo" + i);

    if (saved) {
        photos[i] = saved;
    }

}


/* 숫자 */

function number(n) {

    if (n === 0) {

        current = "0";

        showQuestion();

    } else {

        current = String(n);

        showPhoto(n);

    }

    waiting = false;

}


/* 사진 표시 */

function showPhoto(n) {

    let question =
        document.getElementById("backgroundQuestion");

    let photo =
        document.getElementById("photo");


    if (photos[n]) {

        question.style.display = "none";

        photo.src = photos[n];

        photo.style.display = "block";

    } else {

        question.style.display = "block";

        photo.style.display = "none";

    }

}


/* ? 표시 */

function showQuestion() {

    document.getElementById(
        "backgroundQuestion"
    ).style.display = "block";

    document.getElementById(
        "photo"
    ).style.display = "none";

}


/* 소수점 */

function decimal() {

    if (waiting) {

        current = "0.";
        waiting = false;

        return;

    }

    if (!current.includes(".")) {

        current += ".";

    }

}


/* 연산 */

function operation(x) {

    if (current === "") return;

    previous = current;

    op = x;

    waiting = true;

}


/* 계산 */

function calculate() {

    if (
        previous === "" ||
        current === "" ||
        op === ""
    ) return;


    let a = Number(previous);
    let b = Number(current);

    let result;


    if (op === "+") {
        result = a + b;
    }

    if (op === "-") {
        result = a - b;
    }

    if (op === "×") {
        result = a * b;
    }

    if (op === "÷") {

        if (b === 0) {

            current = "Error";

            return;

        }

        result = a / b;

    }


    current = String(result);

    previous = "";

    op = "";

    waiting = true;

}


/* 전체 삭제 */

function clearAll() {

    current = "";
    previous = "";
    op = "";
    waiting = false;

    showQuestion();

}


/* 한 글자 삭제 */

function deleteNumber() {

    if (
        current === "" ||
        current === "Error"
    ) return;


    current =
        current.slice(0, -1);


    if (current === "") {

        showQuestion();

    }

}


/* 퍼센트 */

function percent() {

    if (current === "") return;

    current =
        String(Number(current) / 100);

}


/* + / - */

function plusMinus() {

    if (current === "") return;

    current =
        String(Number(current) * -1);

}


/* 사진 저장 */

function setPhoto(n, input) {

    let file = input.files[0];

    if (!file) return;


    let reader = new FileReader();


    reader.onload = function(e) {

        photos[n] = e.target.result;


        try {

            localStorage.setItem(
                "photo" + n,
                e.target.result
            );

        } catch (error) {

            alert(
                "사진 용량이 너무 커서 저장하지 못했습니다."
            );

        }

    };


    reader.readAsDataURL(file);

}


/* 설정창 열기 */

function openSettings() {

    document.getElementById(
        "settings"
    ).style.display = "block";

}


/* 설정창 닫기 */

function closeSettings() {

    document.getElementById(
        "settings"
    ).style.display = "none";

}

</script>

</body>
</html>
