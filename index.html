<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>사진 계산기</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
    font-family: Arial, sans-serif;
}

body {
    position: relative;
}

/* 가운데 물음표 */
#backgroundQuestion {
    position: fixed;
    left: 50%;
    top: 43%;

    transform: translate(-50%, -50%);

    font-size: 430px;
    font-weight: bold;
    line-height: 1;

    color: black;

    z-index: 1;

    pointer-events: none;
}

/* 사진 */
#photo {
    position: fixed;
    left: 50%;
    top: 43%;

    transform: translate(-50%, -50%);

    width: 65vw;
    height: 65vw;

    max-width: 420px;
    max-height: 420px;

    object-fit: contain;

    z-index: 1;

    pointer-events: none;

    display: none;
}

/* 계산기 */
.calculator {
    position: fixed;

    left: 50%;
    bottom: 80px;

    transform: translateX(-50%);

    width: calc(100vw - 40px);
    max-width: 430px;

    z-index: 10;
}

/* 사진 설정 버튼 */
.setting {
    position: absolute;

    left: 0;
    bottom: calc(100% + 15px);

    width: 130px;
    height: 55px;

    border: 1px solid #ddd;
    border-radius: 30px;

    background: rgba(255,255,255,0.75);

    color: black;
    font-size: 18px;

    box-shadow: 0 3px 12px rgba(0,0,0,0.12);

    z-index: 50;

    touch-action: manipulation;
}

/* ★ 계산기 버튼 배열 ★ */
.buttons {
    width: 100%;

    display: grid;

    grid-template-columns: repeat(4, 1fr);

    grid-template-rows: repeat(5, 1fr);

    gap: 10px;
}

/* ★ 모든 버튼 완전히 동일한 크기 ★ */
.buttons button {
    width: 100%;
    height: auto;

    aspect-ratio: 1 / 1;

    margin: 0;
    padding: 0;

    border: 1px solid #ddd;
    border-radius: 50%;

    background: rgba(255,255,255,0.65);

    color: black;

    font-size: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow: 0 3px 12px rgba(0,0,0,0.10);

    position: relative;
    z-index: 20;

    touch-action: manipulation;
}

/* ★ AC도 다른 버튼과 똑같음 ★ */
.buttons .ac {
    grid-column: auto;
    grid-row: auto;

    width: 100%;
    height: auto;

    aspect-ratio: 1 / 1;

    border-radius: 50%;

    font-size: 40px;
}

/* 0도 일반 버튼과 같은 크기 */
.buttons .zero {
    grid-column: auto;

    width: 100%;
    height: auto;

    aspect-ratio: 1 / 1;

    border-radius: 50%;
}

/* 연산 버튼 */
.buttons .operator {
    font-size: 42px;
}

/* 눌렀을 때 */
.buttons button:active {
    transform: scale(0.92);
    background: rgba(220,220,220,0.8);
}

/* 설정창 */
#settings {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 90vw;
    max-width: 400px;

    max-height: 80vh;

    overflow-y: auto;

    padding: 25px;

    background: white;

    border-radius: 25px;

    box-shadow: 0 10px 40px rgba(0,0,0,0.25);

    z-index: 100;

    display: none;
}

#settings h2 {
    margin-top: 0;
    text-align: center;
}

.photoSetting {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 8px;

    margin: 14px 0;

    font-size: 17px;
}

.photoSetting input {
    width: 190px;
}

.close {
    width: 100%;
    height: 50px;

    margin-top: 15px;

    border: none;
    border-radius: 25px;

    background: #eee;

    font-size: 18px;
}

/* 화면이 작은 아이폰 */
@media (max-height: 750px) {

    .calculator {
        bottom: 60px;
    }

    .buttons {
        gap: 7px;
    }

    .buttons button {
        font-size: 34px;
    }

    .buttons .operator {
        font-size: 36px;
    }

}
</style>
</head>

<body>

<div id="backgroundQuestion">?</div>

<img id="photo" alt="사진">

<div class="calculator">

    <button class="setting" onclick="openSettings()">
        사진 설정
    </button>

    <div class="buttons">

        <button class="ac" onclick="clearAll()">AC</button>
        <button onclick="deleteNumber()">⌫</button>
        <button onclick="percent()">%</button>
        <button class="operator" onclick="operation('÷')">÷</button>

        <button onclick="number(7)">7</button>
        <button onclick="number(8)">8</button>
        <button onclick="number(9)">9</button>
        <button class="operator" onclick="operation('×')">×</button>

        <button onclick="number(4)">4</button>
        <button onclick="number(5)">5</button>
        <button onclick="number(6)">6</button>
        <button class="operator" onclick="operation('-')">−</button>

        <button onclick="number(1)">1</button>
        <button onclick="number(2)">2</button>
        <button onclick="number(3)">3</button>
        <button class="operator" onclick="operation('+')">+</button>

        <button onclick="plusMinus()">±</button>
        <button class="zero" onclick="number(0)">0</button>
        <button onclick="decimal()">.</button>
        <button class="operator" onclick="calculate()">=</button>

    </div>
</div>


<!-- 사진 설정창 -->

<div id="settings">

    <h2>사진 설정</h2>

    <div class="photoSetting">
        <span>1번</span>
        <input type="file" accept="image/*"
        onchange="setPhoto(1,this)">
    </div>

    <div class="photoSetting">
        <span>2번</span>
        <input type="file" accept="image/*"
        onchange="setPhoto(2,this)">
    </div>

    <div class="photoSetting">
        <span>3번</span>
        <input type="file" accept="image/*"
        onchange="setPhoto(3,this)">
    </div>

    <div class="photoSetting">
        <span>4번</span>
        <input type="file" accept="image/*"
        onchange="setPhoto(4,this)">
    </div>

    <div class="photoSetting">
        <span>5번</span>
        <input type="file" accept="image/*"
        onchange="setPhoto(5,this)">
    </div>

    <div class="photoSetting">
        <span>6번</span>
        <input type="file" accept="image/*"
        onchange="setPhoto(6,this)">
    </div>

    <div class="photoSetting">
        <span>7번</span>
        <input type="file" accept="image/*"
        onchange="setPhoto(7,this)">
    </div>

    <div class="photoSetting">
        <span>8번</span>
        <input type="file" accept="image/*"
        onchange="setPhoto(8,this)">
    </div>

    <div class="photoSetting">
        <span>9번</span>
        <input type="file" accept="image/*"
        onchange="setPhoto(9,this)">
    </div>

    <button class="close" onclick="closeSettings()">
        닫기
    </button>

</div>


<script>

let current = "";
let previous = "";
let op = "";
let waiting = false;

let photos = {};


/* 저장된 사진 불러오기 */

for (let i = 1; i <= 9; i++) {

    let saved = localStorage.getItem("photo" + i);

    if (saved) {
        photos[i] = saved;
    }
}


/* 숫자 */

function number(n) {

    if (n === 0) {

        current = "0";

        showQuestion();

    } else {

        current = String(n);

        showPhoto(n);
    }

    waiting = false;
}


/* 사진 표시 */

function showPhoto(n) {

    let question =
        document.getElementById("backgroundQuestion");

    let photo =
        document.getElementById("photo");

    if (photos[n]) {

        question.style.display = "none";

        photo.src = photos[n];

        photo.style.display = "block";

    } else {

        question.style.display = "block";

        photo.style.display = "none";
    }
}


/* ? 표시 */

function showQuestion() {

    document.getElementById(
        "backgroundQuestion"
    ).style.display = "block";

    document.getElementById(
        "photo"
    ).style.display = "none";
}


/* 소수점 */

function decimal() {

    if (waiting) {

        current = "0.";

        waiting = false;

        return;
    }

    if (!current.includes(".")) {

        current += ".";
    }
}


/* 연산 */

function operation(x) {

    if (current === "") {

        current = "0";
    }

    previous = current;

    op = x;

    waiting = true;
}


/* 계산 */

function calculate() {

    if (
        previous === "" ||
        current === "" ||
        op === ""
    ) {
        return;
    }

    let a = Number(previous);
    let b = Number(current);

    let result = 0;

    if (op === "+") {
        result = a + b;
    }

    else if (op === "-") {
        result = a - b;
    }

    else if (op === "×") {
        result = a * b;
    }

    else if (op === "÷") {

        if (b === 0) {

            current = "Error";

            showQuestion();

            return;
        }

        result = a / b;
    }

    current = String(result);

    previous = "";
    op = "";

    waiting = true;

    showQuestion();
}


/* AC */

function clearAll() {

    current = "";
    previous = "";
    op = "";
    waiting = false;

    showQuestion();
}


/* 삭제 */

function deleteNumber() {

    if (current === "") {
        return;
    }

    current = current.slice(0, -1);

    if (current === "") {
        showQuestion();
    }
}


/* 퍼센트 */

function percent() {

    if (current === "") {
        return;
    }

    current = String(Number(current) / 100);
}


/* +/- */

function plusMinus() {

    if (current === "") {
        return;
    }

    current = String(Number(current) * -1);
}


/* 사진 저장 */

function setPhoto(n, input) {

    let file = input.files[0];

    if (!file) {
        return;
    }

    let reader = new FileReader();

    reader.onload = function(e) {

        photos[n] = e.target.result;

        try {

            localStorage.setItem(
                "photo" + n,
                e.target.result
            );

        } catch (error) {

            alert("사진 용량이 너무 큽니다.");
        }
    };

    reader.readAsDataURL(file);
}


/* 설정창 */

function openSettings() {

    document.getElementById(
        "settings"
    ).style.display = "block";
}


function closeSettings() {

    document.getElementById(
        "settings"
    ).style.display = "none";
}

</script>

</body>
</html>
