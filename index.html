<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>사진 계산기</title>

<style>
* {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: white;
    font-family: Arial, sans-serif;
}

body {
    position: relative;
}

/* 배경 ? */
#backgroundQuestion {
    position: fixed;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);
    font-size: 65vw;
    font-weight: bold;
    line-height: 1;
    color: black;
    z-index: 1;
    pointer-events: none;
}

/* 사진 */
#photo {
    position: fixed;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    width: 70vw;
    height: 50vh;
    object-fit: contain;
    display: none;
    z-index: 2;
    pointer-events: none;
}

/* 계산기 */
.calculator {
    position: fixed;
    width: min(94vw, 430px);
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    z-index: 10;
}

/* 버튼 4 x 5 */
.buttons {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
}

/* 모든 버튼 동일 크기 */
.buttons button {
    width: 100%;
    aspect-ratio: 1 / 1;
    padding: 0;
    margin: 0;
    border: 1px solid rgba(0,0,0,0.15);
    border-radius: 50%;
    background: rgba(255,255,255,0.65);
    color: black;
    font-size: clamp(22px, 7vw, 34px);
    font-weight: 400;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    cursor: pointer;
    position: relative;
    z-index: 20;
    outline: none;
}

.buttons button:active {
    transform: scale(0.93);
    background: rgba(0,0,0,0.12);
}

/* 사진 설정 버튼 */
.setting {
    width: 100%;
    margin-top: 9px;
    padding: 12px;
    border: 1px solid rgba(0,0,0,0.2);
    border-radius: 18px;
    background: rgba(255,255,255,0.8);
    color: black;
    font-size: 17px;
    font-weight: bold;
    touch-action: manipulation;
}

/* 설정창 */
#settings {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 90vw;
    max-width: 400px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 20px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    display: none;
    z-index: 100;
}

#settings h2 {
    text-align: center;
    margin: 0 0 15px;
}

.photoSetting {
    margin-bottom: 10px;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 12px;
    background: #f7f7f7;
}

.photoSetting strong {
    display: block;
    margin-bottom: 7px;
}

.photoSetting input {
    width: 100%;
}

.closeButton {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border: 0;
    border-radius: 15px;
    background: black;
    color: white;
    font-size: 17px;
}

/* 작은 화면 */
@media (max-height: 700px) {
    .calculator {
        bottom: 8px;
    }

    .buttons {
        gap: 6px;
    }

    .setting {
        margin-top: 5px;
        padding: 8px;
    }
}
</style>
</head>

<body>

<div id="backgroundQuestion">?</div>

<img id="photo" alt="사진">

<div class="calculator">

    <div class="buttons">

        <button type="button" data-action="clear">AC</button>
        <button type="button" data-action="delete">⌫</button>
        <button type="button" data-action="percent">%</button>
        <button type="button" data-op="/">÷</button>

        <button type="button" data-num="7">7</button>
        <button type="button" data-num="8">8</button>
        <button type="button" data-num="9">9</button>
        <button type="button" data-op="*">×</button>

        <button type="button" data-num="4">4</button>
        <button type="button" data-num="5">5</button>
        <button type="button" data-num="6">6</button>
        <button type="button" data-op="-">−</button>

        <button type="button" data-num="1">1</button>
        <button type="button" data-num="2">2</button>
        <button type="button" data-num="3">3</button>
        <button type="button" data-op="+">+</button>

        <button type="button" data-action="plusminus">±</button>
        <button type="button" data-num="0">0</button>
        <button type="button" data-action="decimal">.</button>
        <button type="button" data-action="equals">=</button>

    </div>

    <button type="button" class="setting" id="openSettings">
        사진 설정
    </button>

</div>


<!-- 사진 설정창 -->

<div id="settings">

    <h2>사진 설정</h2>

    <div class="photoSetting">
        <strong>1번 사진</strong>
        <input type="file" accept="image/*" data-photo="1">
    </div>

    <div class="photoSetting">
        <strong>2번 사진</strong>
        <input type="file" accept="image/*" data-photo="2">
    </div>

    <div class="photoSetting">
        <strong>3번 사진</strong>
        <input type="file" accept="image/*" data-photo="3">
    </div>

    <div class="photoSetting">
        <strong>4번 사진</strong>
        <input type="file" accept="image/*" data-photo="4">
    </div>

    <div class="photoSetting">
        <strong>5번 사진</strong>
        <input type="file" accept="image/*" data-photo="5">
    </div>

    <div class="photoSetting">
        <strong>6번 사진</strong>
        <input type="file" accept="image/*" data-photo="6">
    </div>

    <div class="photoSetting">
        <strong>7번 사진</strong>
        <input type="file" accept="image/*" data-photo="7">
    </div>

    <div class="photoSetting">
        <strong>8번 사진</strong>
        <input type="file" accept="image/*" data-photo="8">
    </div>

    <div class="photoSetting">
        <strong>9번 사진</strong>
        <input type="file" accept="image/*" data-photo="9">
    </div>

    <button type="button" class="closeButton" id="closeSettings">
        닫기
    </button>

</div>


<script>
/* 사진 불러오기 */

let photos = {};

for (let i = 1; i <= 9; i++) {
    let saved = localStorage.getItem("photo" + i);

    if (saved) {
        photos[i] = saved;
    }
}


/* 화면 */

let question = document.getElementById("backgroundQuestion");
let photo = document.getElementById("photo");


/* 사진 표시 */

function showQuestion() {
    question.style.display = "block";
    photo.style.display = "none";
    photo.src = "";
}

function showPhoto(n) {
    if (photos[n]) {
        question.style.display = "none";
        photo.src = photos[n];
        photo.style.display = "block";
    } else {
        showQuestion();
    }
}


/* 계산기 */

let current = "0";
let oldNumber = null;
let op = null;
let wait = false;


/* 숫자 */

function number(n) {

    /* 0을 누르면 ? */

    if (n === 0) {
        current = "0";
        wait = false;
        showQuestion();
        return;
    }

    if (wait) {
        current = String(n);
        wait = false;
    } else {
        current = String(n);
    }

    showPhoto(n);
}


/* 소수점 */

function decimal() {

    if (wait) {
        current = "0";
        wait = false;
    }

    if (!current.includes(".")) {
        current += ".";
    }
}


/* 연산 */

function operation(o) {

    let n = parseFloat(current);

    if (oldNumber !== null && op !== null) {
        calculate();
        n = parseFloat(current);
    }

    oldNumber = n;
    op = o;
    wait = true;
}


/* 계산 */

function calculate() {

    if (oldNumber === null || op === null) {
        return;
    }

    let n = parseFloat(current);
    let result;


    if (op === "+") {
        result = oldNumber + n;
    }

    if (op === "-") {
        result = oldNumber - n;
    }

    if (op === "*") {
        result = oldNumber * n;
    }

    if (op === "/") {

        if (n === 0) {
            current = "Error";
            oldNumber = null;
            op = null;
            showQuestion();
            return;
        }

        result = oldNumber / n;
    }


    current = String(result);

    oldNumber = null;
    op = null;
    wait = true;
}


/* AC */

function clearAll() {

    current = "0";
    oldNumber = null;
    op = null;
    wait = false;

    showQuestion();
}


/* 삭제 */

function deleteNumber() {

    if (current === "Error") {
        current = "0";
        showQuestion();
        return;
    }

    if (current.length <= 1) {
        current = "0";
    } else {
        current = current.slice(0, -1);
    }
}


/* 퍼센트 */

function percent() {

    let n = parseFloat(current);

    current = String(n / 100);
}


/* + / - */

function plusMinus() {

    if (current === "0") {
        return;
    }

    if (current.startsWith("-")) {
        current = current.substring(1);
    } else {
        current = "-" + current;
    }
}


/* 버튼 연결 */

let buttons = document.querySelectorAll(".buttons button");

buttons.forEach(function(button) {

    /* 숫자 */

    if (button.dataset.num !== undefined) {

        button.addEventListener("click", function(e) {

            e.preventDefault();

            let n = Number(button.dataset.num);

            number(n);
        });
    }


    /* 연산 */

    if (button.dataset.op !== undefined) {

        button.addEventListener("click", function(e) {

            e.preventDefault();

            operation(button.dataset.op);
        });
    }


    /* 기타 */

    if (button.dataset.action !== undefined) {

        button.addEventListener("click", function(e) {

            e.preventDefault();

            let action = button.dataset.action;


            if (action === "clear") {
                clearAll();
            }

            if (action === "delete") {
                deleteNumber();
            }

            if (action === "percent") {
                percent();
            }

            if (action === "plusminus") {
                plusMinus();
            }

            if (action === "decimal") {
                decimal();
            }

            if (action === "equals") {
                calculate();
            }
        });
    }


    /* 길게 눌러 복사 방지 */

    button.addEventListener("contextmenu", function(e) {
        e.preventDefault();
    });

});


/* 사진 설정창 */

let settings = document.getElementById("settings");
let openSettings = document.getElementById("openSettings");
let closeSettings = document.getElementById("closeSettings");


openSettings.addEventListener("click", function(e) {

    e.preventDefault();

    settings.style.display = "block";
});


closeSettings.addEventListener("click", function(e) {

    e.preventDefault();

    settings.style.display = "none";
});


/* 사진 선택 */

let inputs = document.querySelectorAll("input[data-photo]");


inputs.forEach(function(input) {

    input.addEventListener("change", function() {

        let n = input.dataset.photo;
        let file = input.files[0];

        if (!file) {
            return;
        }


        let reader = new FileReader();


        reader.onload = function(e) {

            photos[n] = e.target.result;

            try {

                localStorage.setItem(
                    "photo" + n,
                    e.target.result
                );

            } catch (error) {

                alert("사진 용량이 너무 큽니다.");
            }
        };


        reader.readAsDataURL(file);

    });

});


/* 처음에는 ? */

showQuestion();

</script>

</body>
</html>
