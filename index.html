<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Calculator</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Helvetica Neue", Arial, sans-serif;
}

body {
    color: white;
}

/* 계산기 전체 */
.calculator {
    width: 100%;
    height: 100dvh;
    background: #000;
    position: relative;
    overflow: hidden;
}

/* 위쪽 아이콘 */
.top-button {
    position: absolute;
    top: 125px;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    background: #181818;
    border: 1px solid #292929;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
}

.history-button {
    left: 34px;
}

.settings-button {
    right: 34px;
}

/* 시계 */
.clock {
    width: 38px;
    height: 38px;
    border: 3px solid white;
    border-radius: 50%;
    position: relative;
}

.clock:before {
    content: "";
    position: absolute;
    width: 3px;
    height: 13px;
    background: white;
    left: 16px;
    top: 6px;
    border-radius: 3px;
}

.clock:after {
    content: "";
    position: absolute;
    width: 11px;
    height: 3px;
    background: white;
    left: 7px;
    top: 19px;
    border-radius: 3px;
}

/* 계산기 아이콘 */
.calc-icon {
    width: 34px;
    height: 42px;
    border: 4px solid white;
    border-radius: 6px;
    position: relative;
}

.calc-icon:before {
    content: "";
    position: absolute;
    left: 6px;
    top: 5px;
    width: 15px;
    height: 5px;
    background: white;
    border-radius: 2px;
}

.calc-icon:after {
    content: "•••\A•••\A•••";
    white-space: pre;
    position: absolute;
    left: 7px;
    top: 13px;
    font-size: 10px;
    line-height: 7px;
}

/* 화면 */
.display {
    position: absolute;
    right: 38px;
    top: 540px;
    width: calc(100% - 76px);
    height: 130px;

    display: flex;
    justify-content: flex-end;
    align-items: flex-end;

    font-size: 88px;
    font-weight: 300;
    letter-spacing: -3px;

    overflow: hidden;
}

/* 버튼 영역 */
.buttons {
    position: absolute;
    left: 34px;
    right: 34px;
    bottom: 32px;

    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 1fr);

    gap: 18px;
}

/* 버튼 */
.btn {
    width: 100%;
    aspect-ratio: 1 / 1;
    border: none;
    border-radius: 50%;

    color: white;
    background: #303030;

    font-size: 43px;
    font-weight: 300;

    display: flex;
    align-items: center;
    justify-content: center;

    user-select: none;
    touch-action: manipulation;
}

.btn:active {
    filter: brightness(1.45);
}

.gray {
    background: #636363;
}

.orange {
    background: #ff9f0a;
}

/* 0 버튼 */
.zero {
    grid-column: 2;
}

/* 설정 창 */
.modal-background {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.modal {
    width: calc(100% - 50px);
    max-width: 430px;
    background: #202020;
    border-radius: 22px;
    padding: 24px;
    color: white;
}

.modal h2 {
    margin: 0 0 20px;
    font-size: 24px;
}

.modal input {
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 12px;
    background: #353535;
    color: white;
    font-size: 20px;
    padding: 0 15px;
    outline: none;
    margin-bottom: 12px;
}

.modal button {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    margin-top: 8px;
    color: white;
    background: #ff9f0a;
}

.modal .cancel {
    background: #444;
}

/* 비밀 미디어 */
.secret-screen {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;

    background: black;

    display: none;
    align-items: center;
    justify-content: center;

    z-index: 200;
}

.secret-screen img,
.secret-screen video {
    width: 100%;
    height: 100%;

    object-fit: contain;
    background: black;
}

.close-secret {
    position: absolute;
    right: 20px;
    top: 55px;

    width: 48px;
    height: 48px;

    border: none;
    border-radius: 50%;

    background: rgba(80,80,80,0.7);
    color: white;

    font-size: 28px;
    z-index: 210;
}

/* 작은 화면 */
@media (max-height: 750px) {

    .top-button {
        top: 75px;
        width: 70px;
        height: 70px;
    }

    .history-button {
        left: 25px;
    }

    .settings-button {
        right: 25px;
    }

    .display {
        top: 330px;
        font-size: 75px;
    }

    .buttons {
        left: 25px;
        right: 25px;
        bottom: 20px;
        gap: 10px;
    }

    .btn {
        font-size: 34px;
    }
}
</style>
</head>

<body>

<div class="calculator">

    <!-- 왼쪽 위 -->
    <div class="top-button history-button">
        <div class="clock"></div>
    </div>

    <!-- 오른쪽 위 -->
    <div class="top-button settings-button" onclick="openSettings()">
        <div class="calc-icon"></div>
    </div>

    <!-- 숫자 표시 -->
    <div class="display" id="display"></div>

    <!-- 버튼 -->
    <div class="buttons">

        <button class="btn gray" onclick="backspace()">⌫</button>
        <button class="btn gray" onclick="clearDisplay()">C</button>
        <button class="btn gray" onclick="percent()">%</button>
        <button class="btn orange" onclick="operator('/')">÷</button>

        <button class="btn" onclick="number('7')">7</button>
        <button class="btn" onclick="number('8')">8</button>
        <button class="btn" onclick="number('9')">9</button>
        <button class="btn orange" onclick="operator('*')">×</button>

        <button class="btn" onclick="number('4')">4</button>
        <button class="btn" onclick="number('5')">5</button>
        <button class="btn" onclick="number('6')">6</button>
        <button class="btn orange" onclick="operator('-')">−</button>

        <button class="btn" onclick="number('1')">1</button>
        <button class="btn" onclick="number('2')">2</button>
        <button class="btn" onclick="number('3')">3</button>
        <button class="btn orange" onclick="operator('+')">+</button>

        <button class="btn" onclick="plusMinus()">+/−</button>
        <button class="btn zero" onclick="number('0')">0</button>
        <button class="btn" onclick="decimal()">.</button>
        <button class="btn orange" onclick="equals()">=</button>

    </div>
</div>


<!-- 설정창 -->
<div class="modal-background" id="settingsModal">

    <div class="modal">

        <h2>비밀 계산기 설정</h2>

        <input
            id="passwordInput"
            type="password"
            inputmode="numeric"
            placeholder="비밀번호 숫자"
        >

        <button onclick="savePassword()">
            암호 설정
        </button>

        <input
            id="mediaInput"
            type="file"
            accept="image/*,video/*"
        >

        <button onclick="saveMedia()">
            사진 / 동영상 저장
        </button>

        <button class="cancel" onclick="closeSettings()">
            닫기
        </button>

    </div>

</div>


<!-- 비밀 사진 / 동영상 화면 -->
<div class="secret-screen" id="secretScreen">

    <button class="close-secret" onclick="closeSecret()">×</button>

    <img id="secretImage" style="display:none;">

    <video
        id="secretVideo"
        style="display:none;"
        controls
        playsinline
    ></video>

</div>


<script>

let current = "";
let first = "";
let op = "";
let resetNext = false;


/* =========================
   계산기
========================= */

function updateDisplay() {

    let text = current;

    if (text === "") {
        text = "";
    }

    document.getElementById("display").innerText = text;
}


function number(n) {

    if (resetNext) {
        current = "";
        resetNext = false;
    }

    if (current === "0") {
        current = n;
    } else {
        current += n;
    }

    updateDisplay();
}


function decimal() {

    if (resetNext) {
        current = "";
        resetNext = false;
    }

    if (!current.includes(".")) {

        if (current === "") {
            current = "0.";
        } else {
            current += ".";
        }
    }

    updateDisplay();
}


function clearDisplay() {

    current = "";
    first = "";
    op = "";
    resetNext = false;

    updateDisplay();
}


function backspace() {

    current = current.slice(0, -1);

    updateDisplay();
}


function plusMinus() {

    if (current === "") return;

    if (current.startsWith("-")) {
        current = current.substring(1);
    } else {
        current = "-" + current;
    }

    updateDisplay();
}


function percent() {

    if (current === "") return;

    current = String(Number(current) / 100);

    updateDisplay();
}


function operator(o) {

    if (current === "") return;

    first = current;
    op = o;
    resetNext = true;
}


function equals() {

    /*
       비밀번호 확인
    */

    let savedPassword = localStorage.getItem("calculatorPassword");

    if (
        savedPassword &&
        current === savedPassword &&
        first === "" &&
        op === ""
    ) {

        openSecret();

        return;
    }


    /*
       일반 계산
    */

    if (first === "" || op === "" || current === "") {
        return;
    }

    let a = Number(first);
    let b = Number(current);
    let result = 0;

    if (op === "+") {
        result = a + b;
    }

    if (op === "-") {
        result = a - b;
    }

    if (op === "*") {
        result = a * b;
    }

    if (op === "/") {

        if (b === 0) {
            current = "오류";
            first = "";
            op = "";
            updateDisplay();
            return;
        }

        result = a / b;
    }

    current = String(result);

    first = "";
    op = "";
    resetNext = true;

    updateDisplay();
}


/* =========================
   설정
========================= */

function openSettings() {

    document.getElementById("settingsModal").style.display = "flex";

    let password = localStorage.getItem("calculatorPassword");

    if (password) {
        document.getElementById("passwordInput").value = password;
    }
}


function closeSettings() {

    document.getElementById("settingsModal").style.display = "none";
}


function savePassword() {

    let password =
        document.getElementById("passwordInput").value.trim();

    if (password === "") {
        alert("암호를 입력해주세요.");
        return;
    }

    if (!/^[0-9]+$/.test(password)) {
        alert("숫자만 입력해주세요.");
        return;
    }

    localStorage.setItem(
        "calculatorPassword",
        password
    );

    alert("암호가 설정되었습니다.");

    document.getElementById("passwordInput").value = "";

    closeSettings();
}


/* =========================
   사진 / 동영상 저장
========================= */

function saveMedia() {

    let file =
        document.getElementById("mediaInput").files[0];

    if (!file) {
        alert("사진 또는 동영상을 선택해주세요.");
        return;
    }

    let reader = new FileReader();

    reader.onload = function(e) {

        try {

            localStorage.setItem(
                "secretMedia",
                e.target.result
            );

            localStorage.setItem(
                "secretMediaType",
                file.type
            );

            alert("사진/동영상이 저장되었습니다.");

        } catch (error) {

            alert(
                "파일이 너무 큽니다.\n" +
                "특히 동영상은 브라우저 저장공간 제한 때문에 저장되지 않을 수 있습니다."
            );
        }
    };

    reader.readAsDataURL(file);
}


/* =========================
   비밀 화면
========================= */

function openSecret() {

    let media =
        localStorage.getItem("secretMedia");

    let type =
        localStorage.getItem("secretMediaType");

    if (!media) {

        alert(
            "저장된 사진이나 동영상이 없습니다.\n" +
            "오른쪽 위 계산기 버튼에서 먼저 저장해주세요."
        );

        clearDisplay();

        return;
    }

    let screen =
        document.getElementById("secretScreen");

    let image =
        document.getElementById("secretImage");

    let video =
        document.getElementById("secretVideo");


    image.style.display = "none";
    video.style.display = "none";


    if (type && type.startsWith("video")) {

        video.src = media;
        video.style.display = "block";

        screen.style.display = "flex";

        video.play().catch(() => {});

    } else {

        image.src = media;
        image.style.display = "block";

        screen.style.display = "flex";
    }


    /*
       가능한 경우 브라우저 전체 화면
    */

    if (screen.requestFullscreen) {

        screen.requestFullscreen().catch(() => {});

    }

    clearDisplay();
}


function closeSecret() {

    let screen =
        document.getElementById("secretScreen");

    let video =
        document.getElementById("secretVideo");

    video.pause();

    screen.style.display = "none";

    if (document.fullscreenElement) {

        document.exitFullscreen().catch(() => {});

    }
}


/* 처음 화면 */
updateDisplay();

</script>

</body>
</html>
