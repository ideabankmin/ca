<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>사진 계산기</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    background: white;
    color: black;
    font-family: Arial, sans-serif;
    overflow: hidden;
    position: relative;
}

/* 가운데 ? */
#backgroundQuestion {
    position: fixed;
    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    font-size: 300px;
    font-weight: bold;

    color: black;

    z-index: 0;
    pointer-events: none;
}

/* 사진 */
#photo {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 70vw;
    max-width: 350px;

    max-height: 45vh;

    object-fit: contain;

    z-index: 0;

    display: none;

    pointer-events: none;
}

/* 계산기 */

.calculator {
    width: 100%;
    max-width: 500px;
    height: 100vh;

    margin: auto;
    padding: 15px;

    display: flex;
    flex-direction: column;

    position: relative;
    z-index: 2;
}

/* 화면 */

.display {
    flex: 1;

    display: flex;
    justify-content: flex-end;
    align-items: flex-end;

    padding: 20px 10px;

    overflow: hidden;
}

#result {
    font-size: 80px;
    font-weight: 300;

    color: black;
}

/* 버튼 */

.buttons {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 12px;

    padding-bottom: 15px;
}

button {
    border: none;

    border-radius: 50%;

    aspect-ratio: 1;

    font-size: 35px;

    color: black;

    background: rgba(255, 255, 255, 0.35);

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    box-shadow:
        inset 0 0 0 1px rgba(0,0,0,0.15),
        0 2px 8px rgba(0,0,0,0.12);

    cursor: pointer;

    transition: transform 0.08s;
}

button:active {
    transform: scale(0.94);

    background: rgba(0,0,0,0.18);
}

.gray {
    background: rgba(255,255,255,0.35);
    color: black;
}

.orange {
    background: rgba(255,255,255,0.35);
    color: black;
}

.zero {
    grid-column: span 2;

    border-radius: 50px;

    text-align: left;

    padding-left: 30px;
}


/* 사진 설정 버튼 */

.setting {
    position: fixed;

    top: 15px;
    left: 15px;

    width: auto;
    height: auto;

    min-width: 80px;

    padding: 10px 15px;

    border-radius: 20px;

    aspect-ratio: auto;

    font-size: 15px;

    z-index: 10;

    background: rgba(255,255,255,0.55);
}


/* 설정 창 */

#settings {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 90%;
    max-width: 380px;

    max-height: 80vh;

    overflow-y: auto;

    padding: 20px;

    border-radius: 25px;

    background: rgba(255,255,255,0.88);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow: 0 10px 40px rgba(0,0,0,0.2);

    z-index: 20;

    display: none;
}

#settings h2 {
    margin-top: 0;
    text-align: center;
}

.photoSetting {
    display: flex;
    align-items: center;
    gap: 10px;

    margin: 10px 0;
}

.photoSetting span {
    width: 25px;
    font-size: 20px;
    font-weight: bold;
}

.photoSetting input {
    flex: 1;
}

.close {
    width: 100%;
    height: 50px;

    aspect-ratio: auto;

    border-radius: 20px;

    margin-top: 15px;

    background: rgba(0,0,0,0.1);

    font-size: 18px;
}

</style>
</head>


<body>


<!-- 처음에는 ? -->

<div id="backgroundQuestion">?</div>


<!-- 선택된 사진 -->

<img id="photo" src="">


<!-- 사진 설정 버튼 -->

<button class="setting" onclick="openSettings()">
    사진 설정
</button>


<!-- 설정 창 -->

<div id="settings">

    <h2>숫자별 사진 설정</h2>

    <div class="photoSetting">
        <span>1</span>
        <input type="file" accept="image/*" onchange="setPhoto(1, this)">
    </div>

    <div class="photoSetting">
        <span>2</span>
        <input type="file" accept="image/*" onchange="setPhoto(2, this)">
    </div>

    <div class="photoSetting">
        <span>3</span>
        <input type="file" accept="image/*" onchange="setPhoto(3, this)">
    </div>

    <div class="photoSetting">
        <span>4</span>
        <input type="file" accept="image/*" onchange="setPhoto(4, this)">
    </div>

    <div class="photoSetting">
        <span>5</span>
        <input type="file" accept="image/*" onchange="setPhoto(5, this)">
    </div>

    <div class="photoSetting">
        <span>6</span>
        <input type="file" accept="image/*" onchange="setPhoto(6, this)">
    </div>

    <div class="photoSetting">
        <span>7</span>
        <input type="file" accept="image/*" onchange="setPhoto(7, this)">
    </div>

    <div class="photoSetting">
        <span>8</span>
        <input type="file" accept="image/*" onchange="setPhoto(8, this)">
    </div>

    <div class="photoSetting">
        <span>9</span>
        <input type="file" accept="image/*" onchange="setPhoto(9, this)">
    </div>

    <button class="close" onclick="closeSettings()">
        완료
    </button>

</div>


<!-- 계산기 -->

<div class="calculator">

    <div class="display">
        <div id="result">0</div>
    </div>


    <div class="buttons">

        <button class="gray" onclick="clearAll()">AC</button>

        <button class="gray" onclick="deleteNumber()">⌫</button>

        <button class="gray" onclick="percent()">%</button>

        <button class="orange" onclick="operation('÷')">÷</button>


        <button onclick="number(7)">7</button>

        <button onclick="number(8)">8</button>

        <button onclick="number(9)">9</button>

        <button class="orange" onclick="operation('×')">×</button>


        <button onclick="number(4)">4</button>

        <button onclick="number(5)">5</button>

        <button onclick="number(6)">6</button>

        <button class="orange" onclick="operation('−')">−</button>


        <button onclick="number(1)">1</button>

        <button onclick="number(2)">2</button>

        <button onclick="number(3)">3</button>

        <button class="orange" onclick="operation('+')">+</button>


        <button class="gray" onclick="plusMinus()">+/−</button>

        <button class="zero" onclick="number(0)">0</button>

        <button onclick="decimal()">.</button>

        <button class="orange" onclick="calculate()">=</button>

    </div>

</div>


<script>


let current = "0";

let first = null;

let operator = null;

let waiting = false;


/* 숫자별 사진 */

let photos = {};


/* 저장된 사진 불러오기 */

for (let i = 1; i <= 9; i++) {

    let saved = localStorage.getItem("photo" + i);

    if (saved) {
        photos[i] = saved;
    }

}


/* 화면 */

function show() {

    document.getElementById("result").innerText = current;

}


/* 숫자를 눌렀을 때 */

function number(n) {


    /* 0을 누르면 ? */

    if (n === 0) {

        current = "0";

        showQuestion();

    }


    /* 1~9를 누르면 사진 */

    else {

        current = String(n);

        showPhoto(n);

    }


    /* 계산 대기 상태 */

    waiting = false;

}


/* 사진 보여주기 */

function showPhoto(n) {

    let question =
        document.getElementById("backgroundQuestion");

    let photo =
        document.getElementById("photo");


    if (photos[n]) {

        question.style.display = "none";

        photo.src = photos[n];

        photo.style.display = "block";

    }

    else {

        question.style.display = "block";

        photo.style.display = "none";

    }

}


/* ? 보여주기 */

function showQuestion() {

    document.getElementById(
        "backgroundQuestion"
    ).style.display = "block";


    document.getElementById(
        "photo"
    ).style.display = "none";

}


/* 소수점 */

function decimal() {

    if (current === "오류") {
        clearAll();
    }


    if (waiting) {

        current = "0.";

        waiting = false;

    }

    else if (!current.includes(".")) {

        current += ".";

    }


    show();

}


/* 연산 */

function operation(op) {

    if (current === "오류") {
        return;
    }


    if (
        operator !== null &&
        !waiting
    ) {

        calculate();

    }


    first = Number(current);

    operator = op;

    waiting = true;

}


/* 계산 */

function calculate() {

    if (
        operator === null ||
        first === null
    ) {

        return;

    }


    let second = Number(current);

    let answer;


    if (operator === "+") {

        answer = first + second;

    }

    else if (operator === "−") {

        answer = first - second;

    }

    else if (operator === "×") {

        answer = first * second;

    }

    else if (operator === "÷") {

        if (second === 0) {

            current = "오류";

            first = null;

            operator = null;

            show();

            return;

        }

        answer = first / second;

    }


    current =
        String(Number(answer.toPrecision(12)));


    first = null;

    operator = null;

    waiting = true;


    show();

}


/* AC */

function clearAll() {

    current = "0";

    first = null;

    operator = null;

    waiting = false;


    showQuestion();

    show();

}


/* 삭제 */

function deleteNumber() {

    if (
        waiting ||
        current === "오류"
    ) {

        return;

    }


    if (current.length === 1) {

        current = "0";

        showQuestion();

    }

    else {

        current =
            current.slice(0, -1);

    }


    show();

}


/* 퍼센트 */

function percent() {

    if (current === "오류") {
        return;
    }


    current =
        String(Number(current) / 100);


    show();

}


/* +/− */

function plusMinus() {

    if (
        current === "0" ||
        current === "오류"
    ) {

        return;

    }


    if (current.startsWith("-")) {

        current =
            current.substring(1);

    }

    else {

        current =
            "-" + current;

    }


    show();

}


/* 설정창 열기 */

function openSettings() {

    document.getElementById(
        "settings"
    ).style.display = "block";

}


/* 설정창 닫기 */

function closeSettings() {

    document.getElementById(
        "settings"
    ).style.display = "none";

}


/* 사진 선택 */

function setPhoto(n, input) {

    let file = input.files[0];

    if (!file) {
        return;
    }


    let reader = new FileReader();


    reader.onload = function(e) {

        photos[n] = e.target.result;


        /*
        사진을 브라우저에 저장
        */

        try {

            localStorage.setItem(
                "photo" + n,
                e.target.result
            );

        }

        catch (error) {

            alert(
                "사진 용량이 너무 커서 저장하지 못했습니다."
            );

        }

    };


    reader.readAsDataURL(file);

}


</script>

</body>
</html>
